name: Build mod jar

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 8.11
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.11/bin" >> "$GITHUB_PATH"

      - name: Build with Gradle
        run: gradle build --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: hide-mob-hitboxes-jar
          path: build/libs/*.jar
