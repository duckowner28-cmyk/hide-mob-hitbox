plugins {
	id 'fabric-loom' version '1.14.10'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	mixin {
		defaultRefmapName = "hide-mob-hitboxes-refmap.json"
	}
}

repositories {
	// Add repositories here if you need to depend on other mods.
	// mavenCentral() and the fabric repo are added automatically by loom.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// This mod is purely client-side rendering, so we only need the client
	// portion of Fabric API (still fine to pull the full artifact).
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResourc
